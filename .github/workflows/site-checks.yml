name: Project website checks

on:
  push:
    paths: ['docs/**', 'tools/check_site.py', '.github/workflows/site-checks.yml']
  pull_request:
    paths: ['docs/**', 'tools/check_site.py', '.github/workflows/site-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public pages, metadata, sitemap and local links
        run: python3 tools/check_site.py
